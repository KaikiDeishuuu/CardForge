# CardForge（静态 SPA）。与本机其他站点一致：TLS 终结在回环端口，
# 由 stream.d/reality-stream.conf 按 SNI 转发过来。
server {
    listen 127.0.0.1:8446 ssl;
    server_name game.farc.dev;

    ssl_certificate /etc/letsencrypt/live/game.farc.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.farc.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CARDFORGE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/cardforge/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    etag on;

    access_log /var/log/nginx/game.farc.dev.access.log;
    error_log /var/log/nginx/game.farc.dev.error.log;

    # 注意 style-src 带 'unsafe-inline'：本站用 style={{ "--game-accent": ... }}
    # 传 CSS 自定义属性做主题色，去掉它会让大厅配色和牌面布局失效。
    # 脚本与样式表本身都是外链文件，因此 script-src 保持 'self'。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # 带内容指纹的产物可长期缓存。这里刻意不回落到 index.html：
    # 缺失的 chunk 必须是真 404，GameHost 的模块加载失败重试依赖真实错误。
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA 回落。index.html 必须回源校验，否则换版本后仍会引用已删除的 chunk。
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
}
