# 安全响应头。**必须在每个自带 add_header 的 location 里 include 一次。**
#
# nginx 的 add_header 只在当前层级「没有任何 add_header」时才继承上层：
# 一旦某个 location 写了自己的 add_header（哪怕只是 Cache-Control），
# server 级的全部安全头都会被丢弃。曾因此让 / 和 /assets/ 的响应
# 完全没有 CSP/HSTS/X-Frame-Options，而 /healthz 却有。
#
# style-src 带 'unsafe-inline'：本站用 style={{ "--game-accent": ... }} 传
# CSS 自定义属性做主题色，去掉会让大厅配色与牌面布局失效。
# 脚本与样式表本身都是外链文件，因此 script-src 保持 'self'。
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
